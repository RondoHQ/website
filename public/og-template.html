<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rondo OG Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --rondo-navy: #001b60;
        --rondo-teal: #00908b;
        --rondo-indigo: #993399;
        --rondo-text: #1f3559;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        width: 1200px;
        height: 675px;
        overflow: hidden;
        font-family: "Figtree", system-ui, sans-serif;
        background: #dfe8f1;
      }

      .stage {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: stretch;
        padding: 0;
      }

      .og {
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 0;
        background:
          radial-gradient(520px 320px at 95% 12%, rgba(244, 154, 234, 0.33) 0%, rgba(244, 154, 234, 0) 72%),
          radial-gradient(430px 280px at 35% 88%, rgba(255, 226, 147, 0.36) 0%, rgba(255, 226, 147, 0) 76%),
          linear-gradient(180deg, #f4faff 0%, #fff6ef 100%);
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .blob {
        position: absolute;
        border-radius: 999px;
        filter: blur(28px);
        opacity: 0.45;
        pointer-events: none;
      }

      .blob-1 {
        width: 320px;
        height: 320px;
        background: #9bc2d3;
        left: -140px;
        top: 156px;
      }

      .blob-2 {
        width: 260px;
        height: 260px;
        background: #f995e0;
        right: -120px;
        top: 72px;
      }

      .blob-3 {
        width: 250px;
        height: 250px;
        background: #ffe293;
        left: 360px;
        bottom: -130px;
      }

      .header {
        height: 78px;
        flex: 0 0 78px;
        display: flex;
        align-items: center;
        padding: 0 34px;
        border-bottom: 1px solid #d8e3ee;
        background: rgba(255, 255, 255, 0.94);
        position: relative;
        z-index: 2;
      }

      .header img {
        width: 232px;
        height: auto;
        display: block;
      }

      .hero {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 26px;
        flex: 1;
        align-items: center;
        padding: 18px 34px 30px;
        position: relative;
        z-index: 1;
      }

      .content {
        max-width: 620px;
      }

      h1 {
        margin: 0;
        color: var(--rondo-navy);
        font-size: 76px;
        line-height: 0.94;
        letter-spacing: -0.03em;
        max-width: 620px;
      }

      h1 span {
        display: block;
      }

      p {
        margin: 22px 0 0;
        font-size: 50px;
        line-height: 1.16;
        color: #3d4e6a;
        max-width: 600px;
      }

      .shot-wrap {
        align-self: center;
        justify-self: end;
        width: 100%;
        max-width: 540px;
        border-radius: 16px;
        overflow: hidden;
        background: #edf4f8;
        border: 1px solid #c9d8e8;
        box-shadow: 0 14px 30px rgba(0, 27, 96, 0.16);
      }

      .shot-wrap img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <article class="og" aria-label="Rondo social preview">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

        <header class="header">
          <img src="/rondo-logo-wordmark.svg" alt="Rondo" />
        </header>

        <section class="hero">
          <div class="content">
            <h1><span>Eén platform voor je</span><span>clubadministratie</span></h1>
            <p>Van ledenbeheer en contributie tot facturatie, VOG en ledenpassen.</p>
          </div>
          <div class="shot-wrap">
            <img src="/screenshot-dashboard.webp" alt="Rondo dashboard" />
          </div>
        </section>
      </article>
    </div>
  </body>
</html>
